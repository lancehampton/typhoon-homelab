version: '3.8'

services:
  matchbox:
    image: quay.io/poseidon/matchbox:latest
    container_name: matchbox
    restart: unless-stopped
    ports:
      - "8080:8080"  # HTTP (read-only)
      - "8081:8081"  # gRPC API
    volumes:
      - ./data/matchbox:/var/lib/matchbox:Z
      - ../certs:/etc/matchbox:ro,Z
    command: >
      -address=0.0.0.0:8080
      -rpc-address=0.0.0.0:8081
      -http-address=0.0.0.0:8080
      -data-path=/var/lib/matchbox
      -assets-path=/var/lib/matchbox/assets
      -cert-file=/etc/matchbox/server.crt
      -key-file=/etc/matchbox/server.key
      -ca-file=/etc/matchbox/ca.crt
      -log-level=info
    environment:
      - MATCHBOX_ADDRESS=0.0.0.0:8081
      - MATCHBOX_RPC_ADDRESS=0.0.0.0:8081
      - MATCHBOX_HTTP_ADDRESS=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homelab

  # Official Poseidon dnsmasq - provides proxy DHCP + TFTP for PXE boot
  dnsmasq:
    image: quay.io/poseidon/dnsmasq:latest
    container_name: dnsmasq
    restart: unless-stopped
    network_mode: host
    command: >
      -d -q
      --dhcp-range=${DHCP_RANGE:-192.168.50.1,proxy,255.255.255.0}
      --enable-tftp
      --tftp-root=/var/lib/tftpboot
      --dhcp-userclass=set:ipxe,iPXE
      --pxe-service=tag:#ipxe,x86PC,"PXE chainload to iPXE",undionly.kpxe
      --pxe-service=tag:ipxe,x86PC,"iPXE",http://${DESKTOP_IP:-192.168.50.100}:8080/boot.ipxe
      --pxe-service=tag:#ipxe,X86-64_EFI,"PXE chainload to iPXE UEFI",ipxe.efi
      --pxe-service=tag:ipxe,X86-64_EFI,"iPXE UEFI",http://${DESKTOP_IP:-192.168.50.100}:8080/boot.ipxe
      --address=/matchbox.home/${DESKTOP_IP:-192.168.50.100}
      --log-queries
      --log-dhcp
    profiles:
      - dnsmasq  # Only start if explicitly requested
    cap_add:
      - NET_ADMIN
      - NET_RAW

networks:
  homelab:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}

volumes:
  matchbox-data:
    driver: local
